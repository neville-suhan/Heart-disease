<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prediction Result</title>
    <style>
      :root {
        --bg-1: #07111f;
        --bg-2: #101f33;
        --card: rgba(15, 23, 42, 0.78);
        --primary: #60a5fa;
        --primary-strong: #2563eb;
        --text: #e5eefb;
        --muted: #9fb0c9;
        --success: #34d399;
        --danger: #f87171;
        --warning: #fbbf24;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, "Segoe UI", sans-serif;
        color: var(--text);
        background: radial-gradient(circle at top, rgba(96, 165, 250, 0.17), transparent 30%),
                    linear-gradient(135deg, var(--bg-1), var(--bg-2));
        display: grid;
        place-items: center;
        padding: 32px 16px;
      }

      .card {
        width: min(560px, 100%);
        background: rgba(15, 23, 42, 0.72);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 24px;
        box-shadow: 0 24px 70px rgba(15, 23, 42, 0.55);
        backdrop-filter: blur(12px);
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, rgba(96, 165, 250, 0.18), rgba(52, 211, 153, 0.08));
        padding: 28px 28px 20px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      }

      .badge {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(52, 211, 153, 0.1);
        border: 1px solid rgba(52, 211, 153, 0.25);
        color: #d9fbe9;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 16px 0 8px;
        font-size: clamp(2rem, 5vw, 2.5rem);
      }

      .content {
        padding: 28px;
      }

      .result-box {
        padding: 24px 20px;
        border-radius: 16px;
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.12);
        text-align: center;
      }

      .result-box p {
        margin: 0;
        font-size: clamp(1.1rem, 3vw, 1.4rem);
        font-weight: 700;
        line-height: 1.5;
      }

      .positive {
        color: #d9fbe9;
        background: rgba(52, 211, 153, 0.08);
        border-color: rgba(52, 211, 153, 0.25);
      }

      .negative {
        color: #dbeafe;
        background: rgba(96, 165, 250, 0.08);
        border-color: rgba(96, 165, 250, 0.25);
      }

      .error {
        color: #fde7e7;
        background: rgba(248, 113, 113, 0.08);
        border-color: rgba(248, 113, 113, 0.25);
      }

      .actions {
        margin-top: 22px;
        display: flex;
        justify-content: center;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 20px;
        border-radius: 12px;
        text-decoration: none;
        background: linear-gradient(135deg, var(--primary), var(--primary-strong));
        color: white;
        font-weight: 700;
        box-shadow: 0 16px 26px rgba(37, 99, 235, 0.28);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <span class="badge">Assessment</span>
        <h1>Prediction Result</h1>
      </div>

      <div class="content">
        {% if 'Positive' in result or 'Negative' in result %}
          <div class="result-box {% if 'Positive' in result %}positive{% else %}negative{% endif %}">
            <p>{{ result }}</p>
          </div>
        {% else %}
          <div class="result-box error">
            <p>{{ result }}</p>
          </div>
        {% endif %}

        <div class="actions">
          <a href="/">Back to form</a>
        </div>
      </div>
    </div>
  </body>
</html>
