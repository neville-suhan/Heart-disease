<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heart Disease Predictor</title>
    <style>
      :root {
        --bg-1: #07111f;
        --bg-2: #101f33;
        --card: rgba(15, 23, 42, 0.78);
        --card-border: rgba(148, 163, 184, 0.2);
        --primary: #60a5fa;
        --primary-strong: #2563eb;
        --text: #e5eefb;
        --muted: #9fb0c9;
        --success: #34d399;
        --danger: #f87171;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(37, 99, 235, 0.25), transparent 30%),
          radial-gradient(circle at bottom right, rgba(16, 185, 129, 0.18), transparent 30%),
          linear-gradient(135deg, var(--bg-1), var(--bg-2));
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
      }

      .shell {
        width: min(1100px, 100%);
        background: rgba(15, 23, 42, 0.48);
        border: 1px solid var(--card-border);
        border-radius: 24px;
        box-shadow: 0 25px 80px rgba(15, 23, 42, 0.55);
        backdrop-filter: blur(10px);
        overflow: hidden;
      }

      .hero {
        background: linear-gradient(120deg, rgba(96, 165, 250, 0.15), rgba(52, 211, 153, 0.08));
        padding: 32px 32px 12px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.14);
      }

      .eyebrow {
        display: inline-block;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(96, 165, 250, 0.12);
        border: 1px solid rgba(96, 165, 250, 0.28);
        color: #cfe3ff;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 700;
      }

      h1 {
        margin: 18px 0 8px;
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1.15;
      }

      .subtitle {
        margin: 0;
        max-width: 700px;
        color: var(--muted);
        font-size: 1rem;
      }

      .content {
        padding: 30px 32px 32px;
      }

      form {
        display: grid;
        grid-template-columns: repeat(2, minmax(220px, 1fr));
        gap: 18px 22px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      label {
        font-size: 0.9rem;
        font-weight: 600;
        color: #dfeafc;
      }

      input, select, button {
        font: inherit;
      }

      input, select {
        width: 100%;
        padding: 14px 16px;
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.18);
        color: var(--text);
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
      }

      input::placeholder {
        color: #7f92b0;
      }

      input:focus, select:focus {
        border-color: rgba(96, 165, 250, 0.8);
        box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.15);
      }

      .actions {
        grid-column: 1 / -1;
        display: flex;
        justify-content: flex-end;
        margin-top: 8px;
      }

      button {
        padding: 15px 28px;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--primary), var(--primary-strong));
        color: white;
        font-weight: 700;
        letter-spacing: 0.02em;
        cursor: pointer;
        box-shadow: 0 16px 28px rgba(37, 99, 235, 0.3);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 20px 32px rgba(37, 99, 235, 0.35);
      }

      @media (max-width: 700px) {
        form {
          grid-template-columns: 1fr;
        }

        .hero, .content {
          padding-left: 20px;
          padding-right: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <span class="eyebrow">Risk Assessment</span>
        <h1>Heart Disease Prediction</h1>
        <p class="subtitle">
          Enter patient details below to assess cardiovascular risk using our clinical decision support model.
        </p>
      </header>

      <main class="content">
        <form action="/predict" method="post">
          <div class="field">
            <label for="age">Age</label>
            <input type="number" id="age" name="age" min="0" max="120" required />
          </div>

          <div class="field">
            <label for="sex">Sex</label>
            <select id="sex" name="sex" required>
              <option value="1">Male</option>
              <option value="0">Female</option>
            </select>
          </div>

          <div class="field">
            <label for="cp">Chest Pain Type</label>
            <input type="number" id="cp" name="cp" min="0" max="3" required />
          </div>

          <div class="field">
            <label for="trestbps">Resting Blood Pressure</label>
            <input type="number" id="trestbps" name="trestbps" step="0.1" required />
          </div>

          <div class="field">
            <label for="chol">Serum Cholesterol</label>
            <input type="number" id="chol" name="chol" step="0.1" required />
          </div>

          <div class="field">
            <label for="fbs">Fasting Blood Sugar</label>
            <input type="number" id="fbs" name="fbs" min="0" max="1" required />
          </div>

          <div class="field">
            <label for="restecg">Resting ECG</label>
            <input type="number" id="restecg" name="restecg" min="0" max="2" required />
          </div>

          <div class="field">
            <label for="thalach">Maximum Heart Rate</label>
            <input type="number" id="thalach" name="thalach" step="0.1" required />
          </div>

          <div class="field">
            <label for="exang">Exercise-Induced Angina</label>
            <input type="number" id="exang" name="exang" min="0" max="1" required />
          </div>

          <div class="field">
            <label for="oldpeak">ST Depression</label>
            <input type="number" id="oldpeak" name="oldpeak" step="0.1" required />
          </div>

          <div class="field">
            <label for="slope">Slope of ST Segment</label>
            <input type="number" id="slope" name="slope" min="0" max="2" required />
          </div>

          <div class="field">
            <label for="ca">Major Vessels Colored</label>
            <input type="number" id="ca" name="ca" min="0" max="4" required />
          </div>

          <div class="field full">
            <label for="thal">Thalassemia</label>
            <input type="number" id="thal" name="thal" min="0" max="3" required />
          </div>

          <div class="actions">
            <button type="submit">Predict Risk</button>
          </div>
        </form>
      </main>
    </div>
  </body>
</html>
